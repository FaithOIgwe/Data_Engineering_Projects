name: product-analytics

on:
  push:
    paths: ["product_analytics_dbt/**", ".github/workflows/product-analytics.yml"]
  pull_request:
    paths: ["product_analytics_dbt/**", ".github/workflows/product-analytics.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product_analytics_dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product_analytics_dbt/requirements.txt
      - run: pip install -r requirements.txt
      - name: Raw data is reproducible
        # compare decompressed contents: gzip bytes vary with the zlib version
        run: |
          for f in ga4_events experiment_exposures; do git show HEAD:product_analytics_dbt/data/raw/$f.csv.gz | gunzip | md5sum > /tmp/$f.committed; done
          make data
          for f in ga4_events experiment_exposures; do gunzip -c data/raw/$f.csv.gz | md5sum | diff - /tmp/$f.committed; done
      - name: dbt build (unit tests, models, data tests)
        run: make build
      - name: Incremental build equals full refresh (late-arriving events)
        run: make incremental
      - name: Semantic layer answers the golden questions
        run: make questions
