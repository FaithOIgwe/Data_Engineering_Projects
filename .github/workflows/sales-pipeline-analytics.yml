name: sales-pipeline-analytics

on:
  push:
    paths: ["sales_dbt project/**", ".github/workflows/sales-pipeline-analytics.yml"]
  pull_request:
    paths: ["sales_dbt project/**", ".github/workflows/sales-pipeline-analytics.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "sales_dbt project"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "sales_dbt project/requirements.txt"
      - run: pip install -r requirements.txt
      - name: Raw data is reproducible
        run: |
          python scripts/generate_data.py
          git diff --exit-code -- seeds/
      - name: dbt build (models, tests, snapshot)
        run: make build
      - name: Incremental run still passes
        run: DBT_PROFILES_DIR=. dbt build --select fct_pipeline_daily+
      - name: Semantic layer answers the golden questions
        run: make questions
