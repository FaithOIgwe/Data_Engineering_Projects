version: 2

sources:
  - name: hubspot
    description: >
      HubSpot CRM, replicated by Fivetran. In this repo the raw tables are dbt seeds generated by
      scripts/generate_data.py, shaped like the Fivetran HubSpot connector output.
    schema: raw_hubspot
    loaded_at_field: _fivetran_synced
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 36, period: hour}
    tables:
      - name: deals
        description: Current state of every deal (one row per deal). Overwritten on each sync, so it has no history.
        columns:
          - name: deal_id
            data_tests: [unique, not_null]
      - name: deal_property_history
        description: >
          Every change to tracked deal properties (dealstage, hubspot_owner_id, amount, closedate).
          This is the source of truth for anything time-based. Contains occasional exact duplicates
          from connector re-syncs.
        freshness: null
      - name: deal_pipeline_stages
        description: Pipelines and their stages, with HubSpot's default win probabilities.
        freshness: null
      - name: companies
        description: Creator businesses. creator_account_id links a customer company to its account in the product.
      - name: contacts
        description: Contacts with HubSpot lifecycle-stage timestamps (lead, MQL, SQL, opportunity, customer).
        freshness: null
      - name: owners
        description: HubSpot users who can own deals.
        freshness: null
