snapshots:
  - name: snap_hubspot_deals
    description: >
      Nightly SCD2 snapshot of the deals table. HubSpot's property history already gives us
      history for the four tracked properties, so the marts don't depend on this; it is here as a
      safety net for properties that aren't history-tracked (deal name, lead source, lost reason)
      and as an audit trail of what the deals table said on each run.
    relation: source('hubspot', 'deals')
    config:
      unique_key: deal_id
      strategy: check
      check_cols: ['deal_stage', 'amount', 'hubspot_owner_id', 'close_date', 'lead_source', 'closed_lost_reason', 'is_deleted']
      hard_deletes: invalidate
