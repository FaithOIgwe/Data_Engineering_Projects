version: 2

semantic_models:
  - name: commerce_orders
    description: Purchases of creators' digital products, in USD, by purchase date.
    model: ref('fct_commerce_orders')
    defaults:
      agg_time_dimension: purchase_date
    entities:
      - name: purchase
        type: primary
        expr: purchase_id
      - name: creator
        type: foreign
        expr: creator_id
    dimensions:
      - name: purchase_date
        type: time
        type_params: {time_granularity: day}
      - name: product_type
        type: categorical
      - name: acquisition_channel
        type: categorical
        description: How the selling creator joined, self_serve or sales_led.
      - name: payment_status
        type: categorical
    measures:
      - name: creator_gross_sales_usd
        agg: sum
        expr: gross_amount_usd
      - name: creator_refunds_usd
        agg: sum
        expr: refund_amount_usd
      - name: creator_net_sales_usd
        agg: sum
        expr: net_amount_usd
      - name: successful_orders
        agg: sum
        expr: "case when is_successful_payment then 1 else 0 end"
      - name: selling_creators
        agg: count_distinct
        expr: "case when is_successful_payment then creator_id end"

  - name: creators
    description: Creator accounts.
    model: ref('dim_creators')
    defaults:
      agg_time_dimension: signup_cohort_month
    entities:
      - name: creator
        type: primary
        expr: creator_id
    dimensions:
      - name: signup_cohort_month
        type: time
        type_params: {time_granularity: month}
      - name: acquisition_channel
        type: categorical
      - name: plan
        type: categorical
      - name: country_code
        type: categorical
    measures:
      - name: creator_signups
        agg: count
        expr: creator_id

metrics:
  - name: creator_net_sales_usd
    label: Creator net sales (USD)
    description: >
      What creators earned selling products through the platform: gross sales minus refunds, in USD,
      by purchase date. Excludes failed payments and test purchases.
    type: simple
    type_params: {measure: creator_net_sales_usd}

  - name: creator_gross_sales_usd
    label: Creator gross sales (USD)
    type: simple
    type_params: {measure: creator_gross_sales_usd}

  - name: creator_refunds_usd
    label: Creator refunds (USD)
    description: Refunded amount, by original purchase date.
    type: simple
    type_params: {measure: creator_refunds_usd}

  - name: successful_orders
    label: Successful orders
    description: Purchases where payment succeeded (including later refunds).
    type: simple
    type_params: {measure: successful_orders}

  - name: refund_rate
    label: Refund rate (by amount)
    type: ratio
    type_params:
      numerator: creator_refunds_usd
      denominator: creator_gross_sales_usd

  - name: selling_creators
    label: Selling creators
    description: Distinct creators with at least one successful sale in the period.
    type: simple
    type_params: {measure: selling_creators}

  - name: avg_order_value_usd
    label: Average order value (USD)
    type: ratio
    type_params:
      numerator: creator_gross_sales_usd
      denominator: successful_orders

  - name: creator_signups
    label: Creator sign-ups
    type: simple
    type_params: {measure: creator_signups}
