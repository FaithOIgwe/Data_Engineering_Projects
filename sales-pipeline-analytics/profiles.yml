# Local profile: runs the whole project on DuckDB so anyone can clone and build it.
# The SQL sticks to dbt cross-database macros, so it also runs on Redshift (see the
# commented target below) with the same models.
sales_pipeline_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "sales_pipeline.duckdb"
      threads: 4
