version: 2
models:
  - name: dim_date
    description: One row per day.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
  - name: metricflow_time_spine
    description: Daily time spine for the dbt Semantic Layer.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
